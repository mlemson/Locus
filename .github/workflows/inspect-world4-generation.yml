name: Inspect World 4 generation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-world4-generation.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show relevant gameplay snippets
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          patterns = [
              r'function\s+startNewRun\s*\(',
              r'startNewRun\s*=\s*',
              r'function\s+resetScoreState\s*\(',
              r'function\s+saveGameState\s*\(',
              r'function\s+loadGameState\s*\(',
              r'lastRoundWasSuccess',
              r'latestScoreSnapshot',
              r'game\s*over',
              r'gameOver',
              r'updateBonusInventoryUI',
              r'bonusInventory',
              r'bonusCounts',
              r'bonusBlocks',
              r'function\s+\w*Bonus\w*\s*\(',
              r'bonus\w*\s*=\s*',
              r'bonus-badge',
              r'Math\.random\(\)[^\n\r]{0,200}bonus',
              r'bonus[^\n\r]{0,120}Math\.random\(\)',
              r'random[^\n\r]{0,120}bonus',
              r'bonus[^\n\r]{0,120}random',
          ]
          hits=[]
          for pat in patterns:
              for m in re.finditer(pat,s,re.I):
                  hits.append((m.start(),pat))
          seen=set()
          ordered=[]
          for pos,pat in sorted(hits):
              bucket=pos//1500
              if bucket in seen: continue
              seen.add(bucket); ordered.append((pos,pat))
          print('HITS',len(ordered))
          for i,(pos,pat) in enumerate(ordered):
              start=max(0,pos-1800); end=min(len(s),pos+7000)
              print(f'\n--- HIT {i+1} @ {pos} PATTERN {pat} ---\n')
              print(s[start:end])
