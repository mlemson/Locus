name: Inspect World 4 generation

on:
  push:
    paths:
      - '.github/workflows/inspect-world4-generation.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show generation snippets
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          patterns = [
              r'function\s+[^\n\r{]*(?:World4|world4)[^\n\r{]*\{',
              r'function\s+[^\n\r{]*(?:Purple|Green|purple|green)[^\n\r{]*\{',
              r'world4GenerationVersion',
              r'applyWorld4',
              r'buildWorld4',
          ]
          hits=[]
          for pat in patterns:
              for m in re.finditer(pat,s):
                  if m.start() not in hits:
                      hits.append(m.start())
          hits=sorted(set(hits))
          print('HITS',len(hits))
          for i,pos in enumerate(hits):
              start=max(0,pos-1200); end=min(len(s),pos+6000)
              print(f'\n--- HIT {i+1} @ {pos} ---\n')
              print(s[start:end])
