name: Inspect World 4 generation

on:
  push:
    paths:
      - '.github/workflows/inspect-world4-generation.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact gameplay snippets
        shell: python
        run: |
          from pathlib import Path
          import re
          s = Path('index.html').read_text(encoding='utf-8')
          lines = s.splitlines()
          needles = [
            'function startNewRun()',
            'function resetScoreState(',
            'lastRoundWasSuccess',
            'latestScoreSnapshot',
            'bonusInventory',
            'Math.random()',
            'gameOver',
            'GAME OVER',
          ]
          printed=set()
          for needle in needles:
            print(f'\n===== NEEDLE: {needle} =====')
            for i,line in enumerate(lines):
              if needle.lower() not in line.lower():
                continue
              lo=max(0,i-25); hi=min(len(lines),i+80)
              key=(lo,hi)
              if key in printed: continue
              printed.add(key)
              print(f'\n--- lines {lo+1}-{hi} (match {i+1}) ---')
              for n in range(lo,hi):
                print(f'{n+1:06d}: {lines[n]}')
