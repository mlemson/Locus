name: Inspect World 4 generation

on:
  push:
    paths:
      - '.github/workflows/inspect-world4-generation.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show exact World 4 and reset snippets
        shell: python
        run: |
          from pathlib import Path

          targets = ['index.html', 'world4-citadel.js', 'world4-citadel.css', 'world4-polish.css']
          needles = [
            'function getWorld4PurpleShape',
            'function getWorld4GreenShape',
            'function getWorld4YellowShape',
            'function getWorld4Blue',
            'generationVersion',
            'function startNewRun()',
            'function resetScoreState(',
            'lastRoundWasSuccess',
            'latestScoreSnapshot',
            'bonusInventory',
            'Math.random()',
            'gameOver',
            'GAME OVER',
            'key-symbol',
            'door-glyph',
            'door-cell',
            'random bonus',
          ]

          for filename in targets:
            p = Path(filename)
            if not p.exists():
              continue
            s = p.read_text(encoding='utf-8')
            lines = s.splitlines()
            print(f'\n\n######## {filename} ########')
            printed = set()
            for needle in needles:
              matches = [i for i,line in enumerate(lines) if needle.lower() in line.lower()]
              if not matches:
                continue
              print(f'\n===== NEEDLE: {needle} =====')
              for i in matches[:12]:
                lo=max(0,i-28); hi=min(len(lines),i+95)
                key=(lo,hi)
                if key in printed:
                  continue
                printed.add(key)
                print(f'\n--- lines {lo+1}-{hi} (match {i+1}) ---')
                for n in range(lo,hi):
                  print(f'{n+1:06d}: {lines[n]}')
