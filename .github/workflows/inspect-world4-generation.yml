name: Inspect World 4 generation

on:
  push:
    paths:
      - '.github/workflows/inspect-world4-generation.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export focused run and bonus snippets
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          lines=p.read_text(encoding='utf-8').splitlines()

          def export(name, needles, before=35, after=170):
            out=[]
            for needle in needles:
              hits=[i for i,line in enumerate(lines) if needle.lower() in line.lower()]
              out.append(f'===== {needle} ({len(hits)} hits) =====')
              for i in hits[:8]:
                lo=max(0,i-before); hi=min(len(lines),i+after)
                out.append(f'--- index.html lines {lo+1}-{hi} ---')
                out.extend(f'{n+1:06d}: {lines[n]}' for n in range(lo,hi))
            Path(name).write_text('\n'.join(out),encoding='utf-8')

          export('_inspect_run.txt', ['function startNewRun', 'function resetScoreState', 'lastRoundWasSuccess = false', 'round failed', 'GAME OVER'], 45, 230)
          export('_inspect_symbols.txt', ['__objectiveBonusColorChances', 'BONUS_COLOR_CONFIG', 'bonusColorChances', 'weighted', 'symbol.classList.add', 'random bonus'], 40, 120)
      - name: Commit focused inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _inspect_run.txt _inspect_symbols.txt
          if git diff --cached --quiet; then
            echo "No inspection changes"
          else
            git commit -m "Add run reset and bonus selection inspection output"
            git push
          fi
