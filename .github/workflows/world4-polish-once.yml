name: One-off World 4 polish

on:
  push:
    paths:
      - '.github/workflows/world4-polish-once.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch World 4 UI
        shell: python
        run: |
          from pathlib import Path
          import re

          index_path = Path('index.html')
          js_path = Path('world4-citadel.js')
          css_path = Path('world4-citadel.css')

          # CSS: import the dedicated polish file before any other rules.
          css = css_path.read_text(encoding='utf-8')
          imp = '@import url("world4-polish.css?v=20260914-polish2");\n'
          if not css.startswith(imp):
              css_path.write_text(imp + css, encoding='utf-8')

          # JS: install a World 4 demo button in the existing game menu.
          js = js_path.read_text(encoding='utf-8')
          marker = 'WORLD4_DEMO_MENU_20260914'
          demo = r'''

          /* WORLD4_DEMO_MENU_20260914 */
          (function installWorld4DemoMenu(){
            'use strict';
            const DEMO_LEVEL = 31;
            function closeMenu(){
              const controls = document.getElementById('controls');
              const toggle = document.getElementById('menu-toggle');
              controls?.classList.remove('open');
              toggle?.classList.remove('active');
              toggle?.setAttribute('aria-expanded','false');
            }
            function startDemo(){
              if (typeof window.startLevel !== 'function') return;
              window.startLevel(DEMO_LEVEL);
              closeMenu();
            }
            function install(){
              const controls = document.getElementById('controls');
              if (!controls || document.getElementById('world4-demo-btn')) return;
              const btn = document.createElement('button');
              btn.type = 'button';
              btn.id = 'world4-demo-btn';
              btn.className = 'control-btn';
              btn.setAttribute('aria-label','Start Wereld 4 demo');
              btn.innerHTML = '<span aria-hidden="true">◇</span><strong>Wereld 4 demo</strong><small>Start direct bij wereld 4.1</small>';
              btn.addEventListener('click', startDemo);
              const buttons = Array.from(controls.querySelectorAll(':scope > button'));
              const anchor = buttons.find(el => /open level/i.test(el.textContent || '')) || buttons.find(el => /nieuw spel/i.test(el.textContent || ''));
              if (anchor && anchor.parentNode === controls) anchor.insertAdjacentElement('afterend', btn);
              else controls.appendChild(btn);
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', install, {once:true});
            else install();
            new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true});
          })();
          '''
          if marker not in js:
              js_path.write_text(js.rstrip() + demo + '\n', encoding='utf-8')

          # Cache-bust the files already linked by index.html.
          index = index_path.read_text(encoding='utf-8')
          for name in ('world4-citadel.css','world4-citadel.js'):
              index = re.sub(rf'({re.escape(name)}\?v=)[^"\']+', rf'\g<1>20260914-polish2', index)
          index_path.write_text(index, encoding='utf-8')

      - name: Add demo button styling
        shell: python
        run: |
          from pathlib import Path
          p=Path('world4-polish.css')
          s=p.read_text(encoding='utf-8')
          marker='WORLD4_DEMO_BUTTON_STYLE_20260914'
          if marker not in s:
              s += r'''

          /* WORLD4_DEMO_BUTTON_STYLE_20260914 */
          body:not(.classic-mode) #controls #world4-demo-btn {
            display:grid !important;
            grid-template-columns:34px minmax(0,1fr) !important;
            grid-template-rows:auto auto !important;
            column-gap:10px !important;
            align-items:center !important;
            justify-content:stretch !important;
            min-height:54px !important;
            padding:8px 10px !important;
            text-align:left !important;
            color:#eef6fc !important;
            border-color:rgba(126,198,255,.20) !important;
            background:linear-gradient(145deg,rgba(41,82,112,.54),rgba(16,34,49,.82)) !important;
          }
          #world4-demo-btn > span { grid-row:1 / 3; width:30px; height:30px; display:grid; place-items:center; border-radius:10px; border:1px solid rgba(161,213,250,.20); background:rgba(133,197,239,.08); color:#b9dcf5; font-size:17px; }
          #world4-demo-btn > strong { align-self:end; font-size:12px; line-height:1.2; font-weight:750; color:#f1f7fc !important; }
          #world4-demo-btn > small { align-self:start; margin-top:2px; font-size:9px; line-height:1.25; color:#8fa9bc !important; font-weight:500; }
          '''
              p.write_text(s, encoding='utf-8')

      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Capture current World 4 screenshots
        run: |
          python3 -m http.server 8765 >/tmp/locus-http.log 2>&1 &
          echo $! >/tmp/locus-http.pid
          cat > .capture-world4.js <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            async function shot(level, viewport, file) {
              const page = await browser.newPage({viewportSize:viewport, deviceScaleFactor:1});
              await page.goto('http://127.0.0.1:8765/', {waitUntil:'networkidle'});
              await page.waitForFunction(() => typeof window.startLevel === 'function', null, {timeout:15000});
              await page.evaluate((n) => window.startLevel(n), level);
              await page.waitForTimeout(1200);
              await page.evaluate(() => {
                document.querySelectorAll('[id$="-modal-layer"], .modal-overlay, .onboarding-overlay, #welcome-modal-layer').forEach(el => {
                  if (el.id !== 'controls') el.style.setProperty('display','none','important');
                });
              });
              await page.waitForTimeout(250);
              await page.screenshot({path:file, fullPage:true});
              await page.close();
            }
            await shot(31,{width:1600,height:1000},'world4-latest-41-desktop.png');
            await shot(34,{width:1600,height:1000},'world4-latest-44-desktop.png');
            await shot(31,{width:430,height:932},'world4-latest-41-mobile.png');
            await browser.close();
          })();
          NODE
          node .capture-world4.js
          kill $(cat /tmp/locus-http.pid) || true
          rm -f .capture-world4.js

      - name: Commit result
        run: |
          rm -f .github/workflows/world4-polish-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html world4-citadel.css world4-citadel.js world4-polish.css world4-latest-41-desktop.png world4-latest-44-desktop.png world4-latest-41-mobile.png
          git add -u .github/workflows/world4-polish-once.yml
          git commit -m 'Polish World 4 layout, demo entry and shop contrast'
          git push
