name: Apply World 4 polish

on:
  push:
    paths:
      - '.github/workflows/apply-world4-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python3 _apply_world4_polish.py

      - name: Check JavaScript syntax
        run: |
          node --check world4-citadel.js
          node --check world4-polish.js

      - name: Commit code changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html world4-citadel.js world4-citadel.css world4-polish.css world4-polish.js
          git commit -m "Polish World 4 generation, icons, centering and reset"
          git push

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Locus
        run: |
          python3 -m http.server 8000 >/tmp/locus-http.log 2>&1 &
          sleep 2

      - name: Capture fresh World 4 screenshots
        run: node _capture_world4.cjs

      - name: Commit screenshots and remove temporary inspection files
        run: |
          rm -f _world4_inspect.txt _inspect_generation.txt _inspect_reset.txt _inspect_bonus.txt _inspect_icons.txt _inspect_run.txt _inspect_symbols.txt
          rm -f _apply_world4_polish.py _capture_world4.cjs
          rm -f .github/workflows/inspect-world4-generation.yml .github/workflows/apply-world4-polish.yml
          git add -A
          git commit -m "Add fresh World 4 screenshots and clean up patch helpers"
          git push
