name: Capture World 4 polish v2

on:
  push:
    paths:
      - '.github/workflows/apply-world4-polish.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check patched JavaScript
        run: |
          node --check world4-citadel.js
          node --check world4-polish.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local Locus
        run: |
          python3 -m http.server 8000 >/tmp/locus-http.log 2>&1 &
          sleep 2

      - name: Capture fresh World 4 screenshots
        run: node _capture_world4.cjs

      - name: Commit screenshots and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f _world4_inspect.txt _inspect_generation.txt _inspect_reset.txt _inspect_bonus.txt _inspect_icons.txt _inspect_run.txt _inspect_symbols.txt
          rm -f _apply_world4_polish.py _capture_world4.cjs
          rm -f .github/workflows/inspect-world4-generation.yml .github/workflows/apply-world4-polish.yml
          git add -A
          git commit -m "Add fresh World 4 screenshots and clean up helpers"
          git push
